[package]
name = "compilerpro"
version = "0.1.0"
description = "Offline LaTeX, Mermaid and Markdown editor"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "compilerpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
